[project]
name = "lab-workflow-agent"
version = "0.1.0"
description = "A bounded Moonshot CLI for learning lab workflow orchestration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=1.0,<3", "pydantic-settings>=2.5,<3", "httpx>=0.27,<1"]

[project.scripts]
labops-agent = "lab_workflow_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
